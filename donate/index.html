<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <!-- Menambahkan maximum-scale=1.0 agar layout benar-benar statis (tidak bisa di-zoom tidak sengaja) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>QRIS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Menggunakan h-[100dvh] agar tinggi layar pas secara dinamis -->
<body class="m-0 font-sans bg-gradient-to-b from-[#17295b] to-[#21aaa0] flex justify-center items-center h-[100dvh] w-screen p-3 sm:p-5 overflow-hidden box-border">

  <!-- Card Utama: max-h-full membatasi agar tidak pernah keluar dari layar -->
  <div class="bg-white rounded-2xl sm:rounded-[20px] p-4 sm:p-6 w-full max-w-[400px] max-h-full flex flex-col justify-between shadow-[0_10px_25px_rgba(0,0,0,0.2)]">
    
    <!-- Bagian Atas: flex-none berarti bagian ini ukurannya tidak akan menyusut -->
    <div class="flex-none flex justify-center items-center gap-4 mb-1">
      <img class="h-[20px] sm:h-[25px]" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logo_QRIS.svg/1280px-Logo_QRIS.svg.png" alt="QRIS" />
    </div>

    <h2 class="flex-none text-[#e10000] text-center my-2 text-lg sm:text-xl font-bold">Trakteer Ngopi</h2>

    <!-- Bagian Tengah (QR Code): flex-1 dan min-h-0 adalah KUNCI agar gambar bisa mengkerut di layar pendek (landscape) -->
    <div class="flex-1 min-h-0 w-full flex justify-center items-center my-2">
      <!-- max-h-full dan object-contain memaksa rasio QR tetap kotak tanpa menabrak batas atas-bawah -->
      <img class="max-h-full max-w-full object-contain" src="https://cdn.jsdelivr.net/gh/ambontv/ambontv.github.io@main/img/qrisambontv.png" alt="QR Code" />
    </div>

    <!-- Bagian Bawah: flex-none memastikan teks & logo platform tetap aman ukurannya -->
    <div class="flex-none">
      <div class="text-center text-[#555] text-xs sm:text-[0.95rem] mb-2 mt-1">Kode QR diterima</div>

      <div class="flex justify-center flex-wrap gap-2 sm:gap-4 my-2">
        <img class="h-[20px] sm:h-[28px] w-auto object-contain" src="https://pix.toco.id/resize/fit:contain,f:webp,q:85/static/icon/payment_hd/shopeepay.webp" alt="ShopeePay" />
        <img class="h-[20px] sm:h-[28px] w-auto object-contain" src="https://pix.toco.id/resize/fit:contain,f:webp,q:85/static/icon/payment_hd/dana.webp" alt="Dana" />
        <img class="h-[20px] sm:h-[28px] w-auto object-contain" src="https://pix.toco.id/resize/fit:contain,f:webp,q:85/static/icon/payment_hd/ovo.webp" alt="OVO" />
        <img class="h-[20px] sm:h-[28px] w-auto object-contain" src="https://bitt.my.id/logo/gopay.png" alt="Gopay" />
      </div>

      <div class="text-center text-[10px] sm:text-xs text-black mt-2">dan platform lain yang mendukung QRIS</div>
    </div>

  </div>

</body>
</html>
